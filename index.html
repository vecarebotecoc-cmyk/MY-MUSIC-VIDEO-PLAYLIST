<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY MUSIC PLAYLIST</title>
    <style>
        body {
            background-image: url(BG\ BANDMAID.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            text-align: center;
        }

        .card {
            display: inline-block;
            width: 200px;
            margin: 10px;
            text-align: center;
            color: white;
            vertical-align: top;
        }

        .card h1 {
            font-size: 18px;
            margin-top: 10px;
            word-wrap: break-word;
        }

        marquee {
            color: rosybrown;
            font-size: 80px;
            font-weight: bold;
            display: block;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <marquee behavior="scroll" direction="left">
        MY MUSIC VIDEO
    </marquee>

    <div class="card">
        <a href="Ready to Rock.mp4">
            <img src="BANDMAID.jpg" alt="BANDMAID" width="200" height="200">
        </a>
